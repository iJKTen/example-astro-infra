AWSTemplateFormatVersion: '2010-09-09'
Description: S3 hosting, CloudFront, CI/CD pipeline, and Route 53 for an Astro static site.

Parameters:
  DomainName:
    Type: String
    Description: Fully qualified domain name for the site (e.g. example.net).

  GitHubRepository:
    Type: String
    Description: GitHub repository in owner/repo format (e.g. your-org/your-repo).

  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for the domain.

Resources:
  # ──────────────────────────────────────────────
  # S3 Site Bucket (Post 7)
  # ──────────────────────────────────────────────
  S3WebsiteBucket:
    Type: 'AWS::S3::Bucket'
    # Deleted with the stack. The EmptyWebsiteBucketOnDelete custom resource
    # empties this versioned bucket first so the delete can succeed. Your Git
    # repo is the source of truth for the site, not this bucket.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AutoCleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  # ──────────────────────────────────────────────
  # Pipeline Artifact Bucket (Post 9)
  # ──────────────────────────────────────────────
  PipelineArtifactBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldArtifacts
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 3
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ──────────────────────────────────────────────
  # Empty S3 Buckets on Delete (Post 16)
  # ──────────────────────────────────────────────
  EmptyBucketRole:
    Type: 'AWS::IAM::Role'
    Properties:
      # The Git Sync role scopes iam:CreateRole and iam:PassRole to role/site/*,
      # so every service role this stack creates lives under the /site/ path.
      Path: /site/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Sub '${AWS::AccountId}'
      Policies:
        - PolicyName: EmptyBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:ListBucketVersions'
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !GetAtt S3WebsiteBucket.Arn
              - Effect: Allow
                Action:
                  - 's3:DeleteObject'
                  - 's3:DeleteObjectVersion'
                Resource:
                  - !Sub '${PipelineArtifactBucket.Arn}/*'
                  - !Sub '${S3WebsiteBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-EmptyBucket*'

  EmptyBucketFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: !Sub '${AWS::StackName}-EmptyBucket'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt EmptyBucketRole.Arn
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          # Bail out of the delete loop with this much time left so the function
          # reports FAILED instead of being killed mid-request and hanging the
          # stack until the custom resource's ServiceTimeout elapses.
          MIN_REMAINING_MILLIS = 20000
          SEND_RESPONSE_ATTEMPTS = 3

          def put_response(event, context, status, reason, physical_id):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }).encode("utf-8")
              req = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  headers={"Content-Type": "", "Content-Length": str(len(body))},
                  method="PUT",
              )
              urllib.request.urlopen(req)

          def send_response(event, context, status, reason, physical_id):
              for attempt in range(1, SEND_RESPONSE_ATTEMPTS + 1):
                  try:
                      put_response(event, context, status, reason, physical_id)
                      return
                  except Exception as e:
                      print(f"send_response attempt {attempt} failed: {e}")
                      if attempt == SEND_RESPONSE_ATTEMPTS:
                          raise
                      time.sleep(attempt)

          def handler(event, context):
              bucket = (event.get("ResourceProperties") or {}).get("BucketName")
              # Reusing event.PhysicalResourceId on Update and Delete keeps the id
              # stable, so CloudFormation never treats a response as a replacement
              # and sends a destructive Delete to the "old" resource.
              physical_id = event.get("PhysicalResourceId") or f"empty-bucket-{bucket}"

              if not isinstance(bucket, str) or not bucket:
                  send_response(event, context, "FAILED", "ResourceProperties.BucketName must be a non-empty string", physical_id)
                  return

              if event["RequestType"] != "Delete":
                  send_response(event, context, "SUCCESS", "", physical_id)
                  return

              try:
                  s3 = boto3.client("s3")
                  paginator = s3.get_paginator("list_object_versions")
                  for page in paginator.paginate(Bucket=bucket):
                      if context.get_remaining_time_in_millis() < MIN_REMAINING_MILLIS:
                          send_response(event, context, "FAILED", "Function timeout approaching before the bucket was fully emptied; retry the stack deletion", physical_id)
                          return
                      objects = []
                      for v in page.get("Versions", []):
                          objects.append({"Key": v["Key"], "VersionId": v["VersionId"]})
                      for m in page.get("DeleteMarkers", []):
                          objects.append({"Key": m["Key"], "VersionId": m["VersionId"]})
                      if objects:
                          resp = s3.delete_objects(Bucket=bucket, Delete={"Objects": objects, "Quiet": True})
                          errors = resp.get("Errors", [])
                          if errors:
                              first = errors[0]
                              send_response(event, context, "FAILED", f"DeleteObjects failed for {len(errors)} object(s); first: {first.get('Key')} {first.get('Code')} {first.get('Message')}", physical_id)
                              return
                  send_response(event, context, "SUCCESS", "", physical_id)
              except ClientError as e:
                  print(f"Error emptying bucket: {e}")
                  # Delete is idempotent: a missing bucket is already in the goal state.
                  if e.response.get("Error", {}).get("Code") == "NoSuchBucket":
                      send_response(event, context, "SUCCESS", "Bucket already deleted", physical_id)
                      return
                  send_response(event, context, "FAILED", str(e), physical_id)
              except Exception as e:
                  print(f"Error emptying bucket: {e}")
                  send_response(event, context, "FAILED", str(e), physical_id)

  EmptyArtifactBucketOnDelete:
    Type: 'Custom::EmptyS3Bucket'
    Properties:
      ServiceToken: !GetAtt EmptyBucketFunction.Arn
      # Slightly above the Lambda's 300s timeout, so a hung invocation fails
      # fast instead of CloudFormation waiting the default 3600 seconds.
      ServiceTimeout: 330
      BucketName: !Ref PipelineArtifactBucket

  EmptyWebsiteBucketOnDelete:
    Type: 'Custom::EmptyS3Bucket'
    Properties:
      ServiceToken: !GetAtt EmptyBucketFunction.Arn
      ServiceTimeout: 330
      BucketName: !Ref S3WebsiteBucket

  # ──────────────────────────────────────────────
  # Artifact Bucket Policy
  # ──────────────────────────────────────────────
  ArtifactBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref PipelineArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PipelineArtifactBucket.Arn
              - !Sub '${PipelineArtifactBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ──────────────────────────────────────────────
  # S3 Bucket Policy (Post 8)
  # ──────────────────────────────────────────────
  BucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref S3WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${S3WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt S3WebsiteBucket.Arn
              - !Sub '${S3WebsiteBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ──────────────────────────────────────────────
  # Build Project (Post 11)
  # ──────────────────────────────────────────────
  BuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub '${AWS::StackName}-Build'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_CUSTOM_CACHE
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 20
              commands:
                - npm ci
            build:
              commands:
                - npm run build
          artifacts:
            base-directory: dist
            files:
              - '**/*'
          cache:
            paths:
              - 'node_modules/**/*'

  # ──────────────────────────────────────────────
  # CodeBuild Service Role (Post 11)
  # ──────────────────────────────────────────────
  CodeBuildServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      Path: /site/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Sub '${AWS::AccountId}'
                'aws:SourceArn': !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-Build'
      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-Build*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub '${PipelineArtifactBucket.Arn}/*'
                  - !GetAtt PipelineArtifactBucket.Arn

  # ──────────────────────────────────────────────
  # Deploy Project (Post 14)
  # ──────────────────────────────────────────────
  DeployProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub '${AWS::StackName}-Deploy'
      ServiceRole: !GetAtt DeployServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: DEPLOY_BUCKET
            Value: !Ref S3WebsiteBucket
          - Name: CLOUDFRONT_DIST_ID
            Value: !Ref CloudFrontDistribution
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - aws s3 sync . s3://$DEPLOY_BUCKET --delete --cache-control "max-age=31536000,public,immutable" --exclude "*.html"
                # HTML: revalidate every request; no-store is omitted so pages stay bfcache-eligible
                - aws s3 sync . s3://$DEPLOY_BUCKET --delete --cache-control "max-age=0,no-cache,must-revalidate" --exclude "*" --include "*.html"
            post_build:
              commands:
                - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"

  # ──────────────────────────────────────────────
  # Deploy Service Role (Post 13)
  # ──────────────────────────────────────────────
  DeployServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      Path: /site/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Sub '${AWS::AccountId}'
                'aws:SourceArn': !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-Deploy'
      Policies:
        - PolicyName: DeployAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-Deploy*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub '${PipelineArtifactBucket.Arn}/*'
                  - !GetAtt PipelineArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt S3WebsiteBucket.Arn
                  - !Sub '${S3WebsiteBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 'cloudfront:CreateInvalidation'
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ──────────────────────────────────────────────
  # CodePipeline Service Role (Post 10)
  # ──────────────────────────────────────────────
  CodePipelineServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      Path: /site/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Sub '${AWS::AccountId}'
      Policies:
        - PolicyName: PipelineAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub '${PipelineArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: 'codestar-connections:UseConnection'
                Resource: !ImportValue Example-GitHubConnectionArn
              - Effect: Allow
                Action:
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:StartBuild'
                Resource:
                  - !GetAtt BuildProject.Arn
                  - !GetAtt DeployProject.Arn

  # ──────────────────────────────────────────────
  # Pipeline (Post 10 + Post 13)
  # ──────────────────────────────────────────────
  Pipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ConnectionArn: !ImportValue Example-GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepository
                BranchName: main
                OutputArtifactFormat: CODE_ZIP
        - Name: Build
          Actions:
            - Name: SiteBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref BuildProject
        - Name: Deploy
          Actions:
            - Name: SiteDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref DeployProject

  # ──────────────────────────────────────────────
  # CloudFront OAC (Post 8)
  # ──────────────────────────────────────────────
  CloudFrontOAC:
    Type: 'AWS::CloudFront::OriginAccessControl'
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-OAC'
        Description: !Sub 'OAC for ${DomainName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ──────────────────────────────────────────────
  # Security Headers Policy (Post 14)
  # ──────────────────────────────────────────────
  SecurityHeadersPolicy:
    Type: 'AWS::CloudFront::ResponseHeadersPolicy'
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-SecurityHeaders'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

  # ──────────────────────────────────────────────
  # Subdirectory Index Function (Post 14 + Post 18)
  # ──────────────────────────────────────────────
  SubdirectoryIndexFunction:
    Type: 'AWS::CloudFront::Function'
    Properties:
      AutoPublish: true
      Name: !Sub '${AWS::StackName}-IndexRewrite'
      FunctionConfig:
        Comment: 'Redirects www to apex, then appends index.html to subdirectory requests'
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host.value.toLowerCase();
            if (host.startsWith('www.')) {
                var qs = '';
                var keys = Object.keys(request.querystring);
                for (var i = 0; i < keys.length; i++) {
                    var key = keys[i];
                    var entry = request.querystring[key];
                    if (entry.multiValue) {
                        for (var j = 0; j < entry.multiValue.length; j++) {
                            qs += (qs ? '&' : '?') + key + (entry.multiValue[j].value ? '=' + entry.multiValue[j].value : '');
                        }
                    } else {
                        qs += (qs ? '&' : '?') + key + (entry.value ? '=' + entry.value : '');
                    }
                }
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                        location: { value: 'https://' + host.slice(4) + request.uri + qs }
                    }
                };
            }
            var uri = request.uri;
            if (uri.endsWith('/')) {
                request.uri += 'index.html';
            } else if (!uri.includes('.')) {
                request.uri += '/index.html';
            }
            return request;
        }

  # ──────────────────────────────────────────────
  # CloudFront Distribution (Post 8 + Post 14)
  # ──────────────────────────────────────────────
  CloudFrontDistribution:
    Type: 'AWS::CloudFront::Distribution'
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt S3WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS Managed CachingOptimized policy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SubdirectoryIndexFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !ImportValue Example-CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # ──────────────────────────────────────────────
  # Route 53 Record (Post 12)
  # ──────────────────────────────────────────────
  DomainRecord:
    Type: 'AWS::Route53::RecordSet'
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordAAAA:
    Type: 'AWS::Route53::RecordSet'
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwDomainRecord:
    Type: 'AWS::Route53::RecordSet'
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwDomainRecordAAAA:
    Type: 'AWS::Route53::RecordSet'
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  WebsiteBucketName:
    Description: S3 bucket hosting the website assets
    Value: !Ref S3WebsiteBucket

  SiteUrl:
    Description: Live site URL
    Value: !Sub 'https://${DomainName}'
